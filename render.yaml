# Render Blueprint — deploys TriageBot as a free web service.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: triagebot
    runtime: python
    plan: free
    region: singapore            # closest free region to India
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      # Optional secret: set it in the Render dashboard (never in this file).
      # Without it, GitHub allows only 60 API requests/hour per IP.
      - key: GITHUB_TOKEN
        sync: false
